{{ define "main" }}
  <main class="site-shell">
    <header class="site-header">
      <a href="/" class="brand">
        <span class="brand-logo">
          <img src="/images/monkeytactics-logo.png" alt="MonkeyTactics logo" />
        </span>
        <span>
          <div class="brand-name">MonkeyTactics</div>
          <div class="brand-tagline">Free Online Calculators &amp; Tools</div>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="https://monkeytactics.com/tools/">All Tools</a>
        <a href="/posts/">Blog</a>
        <a href="/posts/">Posts</a>
        <a href="/">Home</a>
      </nav>
    </header>

    <article class="article-shell">
      <div class="article-meta">
        {{ .Date.Format "January 2, 2006" }}
      </div>
      <h1>{{ .Title }}</h1>
      <div class="prose">
        {{ .Content }}
      </div>
    </article>
  </main>
{{ end }}
