{{ define "main" }}
  <main class="site-shell">
    <header class="site-header">
      <a href="/" class="brand">
        <span class="brand-logo">
          <img src="/images/monkeytactics-logo.png" alt="MonkeyTactics logo" />
        </span>
        <span>
          <div class="brand-name">MonkeyTactics</div>
          <div class="brand-tagline">Free Online Calculators &amp; Tools</div>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="https://monkeytactics.com/tools/">All Tools</a>
        <a href="/posts/">Blog</a>
        <a href="/posts/">Posts</a>
        <a href="/">Home</a>
      </nav>
    </header>

    <section class="section-block">
      <div class="section-heading">
        <h2>{{ .Title }}</h2>
        <p>Browse the latest posts from MonkeyTactics.</p>
      </div>
      <div class="content-grid">
        {{ range .Pages }}
          <a class="post-card" href="{{ .RelPermalink }}">
            <strong>{{ .Title }}</strong>
            <p>{{ .Summary | plainify | truncate 120 }}</p>
          </a>
        {{ end }}
      </div>
    </section>
  </main>
{{ end }}
