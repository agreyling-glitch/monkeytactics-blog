<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">A shared Quordle turn affects four boards differently</title>
  <desc id="desc">A central shared guess branches to four boards with 3, 28, 2, and 74 candidate words. Horizontal bars show different information gain on each board.</desc>
  <rect width="1200" height="460" rx="28" fill="#07131c"/>
  <text x="600" y="48" text-anchor="middle" fill="#d8fbe6" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">ONE SHARED GUESS, FOUR DIFFERENT PAYOFFS</text>
  <rect x="465" y="78" width="270" height="68" rx="16" fill="#3a3011" stroke="#f4c542" stroke-width="3"/>
  <text x="600" y="120" text-anchor="middle" fill="#ffd866" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800" letter-spacing="5">SCORN</text>
  <path d="M600 146 V174 M600 174 H154 V196 M600 174 H448 V196 M600 174 H752 V196 M600 174 H1046 V196" fill="none" stroke="#4ade80" stroke-width="3" opacity=".8"/>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(32 196)">
      <rect width="244" height="220" rx="18" fill="#0d241b" stroke="#2f855a" stroke-width="2"/>
      <text x="20" y="39" fill="#f0fff5" font-size="23" font-weight="700">Board 1</text>
      <text x="224" y="39" text-anchor="end" fill="#a7cdb5" font-size="17">3 left</text>
      <text x="20" y="78" fill="#90b8a0" font-size="15" font-weight="700">INFORMATION</text>
      <rect x="20" y="92" width="204" height="12" rx="6" fill="#1c3d30"/>
      <rect x="20" y="92" width="18" height="12" rx="6" fill="#4ade80"/>
      <text x="20" y="139" fill="#d8fbe6" font-size="18">Nearly solved</text>
      <text x="20" y="170" fill="#87a995" font-size="16">This probe adds little.</text>
    </g>
    <g transform="translate(326 196)">
      <rect width="244" height="220" rx="18" fill="#0d241b" stroke="#2f855a" stroke-width="2"/>
      <text x="20" y="39" fill="#f0fff5" font-size="23" font-weight="700">Board 2</text>
      <text x="224" y="39" text-anchor="end" fill="#a7cdb5" font-size="17">28 left</text>
      <text x="20" y="78" fill="#90b8a0" font-size="15" font-weight="700">INFORMATION</text>
      <rect x="20" y="92" width="204" height="12" rx="6" fill="#1c3d30"/>
      <rect x="20" y="92" width="145" height="12" rx="6" fill="#4ade80"/>
      <text x="20" y="139" fill="#d8fbe6" font-size="18">Useful split</text>
      <text x="20" y="170" fill="#87a995" font-size="16">Several families divide.</text>
    </g>
    <g transform="translate(630 196)">
      <rect width="244" height="220" rx="18" fill="#0d241b" stroke="#2f855a" stroke-width="2"/>
      <text x="20" y="39" fill="#f0fff5" font-size="23" font-weight="700">Board 3</text>
      <text x="224" y="39" text-anchor="end" fill="#a7cdb5" font-size="17">2 left</text>
      <text x="20" y="78" fill="#90b8a0" font-size="15" font-weight="700">INFORMATION</text>
      <rect x="20" y="92" width="204" height="12" rx="6" fill="#1c3d30"/>
      <rect x="20" y="92" width="92" height="12" rx="6" fill="#4ade80"/>
      <text x="20" y="139" fill="#d8fbe6" font-size="18">Tie broken</text>
      <text x="20" y="170" fill="#87a995" font-size="16">C separates two words.</text>
    </g>
    <g transform="translate(924 196)">
      <rect width="244" height="220" rx="18" fill="#0d241b" stroke="#2f855a" stroke-width="2"/>
      <text x="20" y="39" fill="#f0fff5" font-size="23" font-weight="700">Board 4</text>
      <text x="224" y="39" text-anchor="end" fill="#a7cdb5" font-size="17">74 left</text>
      <text x="20" y="78" fill="#90b8a0" font-size="15" font-weight="700">INFORMATION</text>
      <rect x="20" y="92" width="204" height="12" rx="6" fill="#1c3d30"/>
      <rect x="20" y="92" width="180" height="12" rx="6" fill="#4ade80"/>
      <text x="20" y="139" fill="#d8fbe6" font-size="18">Largest payoff</text>
      <text x="20" y="170" fill="#87a995" font-size="16">Cold board gets coverage.</text>
    </g>
  </g>
</svg>
