<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Scrabble and Words With Friends board geometry</title>
  <desc id="desc">A simplified side-by-side comparison. Scrabble emphasizes separated word-multiplier lanes, while Words With Friends creates more clustered letter and word premium opportunities.</desc>
