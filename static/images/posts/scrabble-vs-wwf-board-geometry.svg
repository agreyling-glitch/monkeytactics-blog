      <rect x="373" y="304" width="53" height="42" rx="6" fill="#dc2626"/><text x="399.5" y="332" fill="white">TW</text>
      <rect x="188" y="154" width="53" height="42" rx="6" fill="#f59eaa"/><text x="214.5" y="182" fill="#7f1d1d">DW</text>
      <rect x="65" y="104" width="53" height="42" rx="6" fill="#60a5fa"/><text x="91.5" y="132" fill="#082f49">DL</text>
      <rect x="311" y="204" width="53" height="42" rx="6" fill="#2563eb"/><text x="337.5" y="232" fill="white">TL</text>
    </g>
    <path d="M31 72 C130 28 285 28 399 72" fill="none" stroke="#be123c" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>
