  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#0f172a">How premium geometry changes the decision</text>
  <text x="300" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Scrabble</text>
  <text x="900" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Words With Friends</text>

  <g transform="translate(85 140)">
