<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How clue meaning and answer patterns combine</title>
  <desc id="desc">A clue produces semantic candidates, crossing letters produce structural candidates, and their intersection produces ranked crossword answers.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15271d"/>
      <stop offset="1" stop-color="#0d1712"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#214d32"/>
      <stop offset="1" stop-color="#173522"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78d69a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="30" fill="#08110c"/>
  <text x="600" y="62" fill="#f4f7f5" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Two kinds of evidence, one ranked result list</text>
  <text x="600" y="98" fill="#a9b9af" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">Meaning broadens the search. Crossing letters constrain it.</text>

  <rect x="55" y="145" width="315" height="270" rx="22" fill="url(#panel)" stroke="#315441" stroke-width="2"/>
  <circle cx="110" cy="200" r="26" fill="#1f5032"/>
  <text x="110" y="208" fill="#b7f7cf" font-family="Georgia, serif" font-size="25" font-weight="700" text-anchor="middle">?</text>
  <text x="150" y="194" fill="#f4f7f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Clue meaning</text>
  <text x="150" y="222" fill="#a9b9af" font-family="Inter, Arial, sans-serif" font-size="16">“Beginning”</text>
  <text x="87" y="280" fill="#78d69a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">SEMANTIC CANDIDATES</text>
  <text x="87" y="320" fill="#f4c95d" font-family="ui-monospace, monospace" font-size="22">START</text>
  <text x="87" y="354" fill="#f4c95d" font-family="ui-monospace, monospace" font-size="22">ONSET</text>
  <text x="87" y="388" fill="#f4c95d" font-family="ui-monospace, monospace" font-size="22">ORIGIN</text>

  <rect x="430" y="145" width="315" height="270" rx="22" fill="url(#panel)" stroke="#315441" stroke-width="2"/>
  <rect x="468" y="174" width="52" height="52" rx="8" fill="#f4c95d"/>
  <text x="494" y="209" fill="#151105" font-family="ui-monospace, monospace" font-size="28" font-weight="700" text-anchor="middle">?</text>
  <text x="540" y="194" fill="#f4f7f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Answer pattern</text>
  <text x="540" y="222" fill="#a9b9af" font-family="ui-monospace, monospace" font-size="17">? N ? ? T</text>
  <text x="462" y="280" fill="#78d69a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">STRUCTURAL CANDIDATES</text>
  <text x="462" y="320" fill="#f4c95d" font-family="ui-monospace, monospace" font-size="22">ONSET</text>
  <text x="462" y="354" fill="#d4ddd7" font-family="ui-monospace, monospace" font-size="22">INEPT</text>
  <text x="462" y="388" fill="#d4ddd7" font-family="ui-monospace, monospace" font-size="22">UNMET</text>

  <path d="M 370 280 C 395 280, 400 280, 425 280" fill="none" stroke="#78d69a" stroke-width="4" marker-end="url(#arrow)" opacity=".8"/>
  <path d="M 745 280 C 775 280, 785 280, 815 280" fill="none" stroke="#78d69a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="825" y="145" width="320" height="270" rx="22" fill="url(#result)" stroke="#78d69a" stroke-width="3"/>
  <text x="985" y="200" fill="#b7f7cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">INTERSECTION</text>
  <text x="985" y="254" fill="#f4c95d" font-family="ui-monospace, monospace" font-size="42" font-weight="700" letter-spacing="7" text-anchor="middle">ONSET</text>
  <text x="985" y="300" fill="#f4f7f5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Ranked result</text>
  <text x="985" y="337" fill="#b7f7cf" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">meaning + pattern + length</text>
  <text x="985" y="369" fill="#b7f7cf" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">+ dictionary + source quality</text>

  <text x="600" y="486" fill="#d4ddd7" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">Either side can work alone. Together, they remove different kinds of wrong answers.</text>
</svg>
