<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Static versus dynamic QR code request flow</title>
  <desc id="desc">A static QR code sends the scanner directly to the destination. A dynamic QR code first sends the scanner to the QR provider's redirect and analytics service, which then forwards the request to the destination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Static vs. dynamic QR code flow</text>
  <text x="60" y="100" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">The important difference is who sits between the scanner and the destination.</text>

  <rect x="52" y="138" width="1096" height="156" rx="18" fill="#0b1324" stroke="#22c55e" stroke-width="2"/>
  <text x="78" y="178" fill="#86efac" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">STATIC QR</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="112" y="205" width="210" height="60" rx="12" fill="#111c30" stroke="#475569"/><text x="217" y="242" fill="#f8fafc" font-size="19">Phone scans code</text>
    <rect x="495" y="205" width="210" height="60" rx="12" fill="#14532d" stroke="#4ade80"/><text x="600" y="232" fill="#dcfce7" font-size="18">Direct URL or data</text><text x="600" y="253" fill="#bbf7d0" font-size="14">stored in the symbol</text>
    <rect x="878" y="205" width="210" height="60" rx="12" fill="#111c30" stroke="#475569"/><text x="983" y="242" fill="#f8fafc" font-size="19">Destination</text>
  </g>
  <path d="M322 235 H482" stroke="#4ade80" stroke-width="4" marker-end="url(#arrowGreen)"/><path d="M705 235 H865" stroke="#4ade80" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="52" y="326" width="1096" height="184" rx="18" fill="#0b1324" stroke="#f59e0b" stroke-width="2"/>
  <text x="78" y="366" fill="#fde68a" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">DYNAMIC QR</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="82" y="401" width="190" height="66" rx="12" fill="#111c30" stroke="#475569"/><text x="177" y="441" fill="#f8fafc" font-size="18">Phone scans code</text>
    <rect x="349" y="401" width="210" height="66" rx="12" fill="#713f12" stroke="#fbbf24"/><text x="454" y="429" fill="#fef3c7" font-size="17">Provider short link</text><text x="454" y="451" fill="#fde68a" font-size="14">stored in the symbol</text>
    <rect x="636" y="401" width="210" height="66" rx="12" fill="#713f12" stroke="#fbbf24"/><text x="741" y="429" fill="#fef3c7" font-size="17">Redirect + analytics</text><text x="741" y="451" fill="#fde68a" font-size="14">provider receives scan</text>
    <rect x="923" y="401" width="190" height="66" rx="12" fill="#111c30" stroke="#475569"/><text x="1018" y="441" fill="#f8fafc" font-size="18">Destination</text>
  </g>
  <path d="M272 434 H336" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrowAmber)"/><path d="M559 434 H623" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrowAmber)"/><path d="M846 434 H910" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrowAmber)"/>
</svg>
