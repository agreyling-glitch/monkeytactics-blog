baseURL = "https://blog.monkeytactics.com/"
locale = "en-us"
title = "MonkeyTactics Blog"
theme = "explore"
summaryLength = 70

[outputs]
  home = ["HTML", "RSS", "JSON", "MenuSearch"]

[outputFormats.MenuSearch]
  mediaType = "application/json"
  baseName = "menu-search"
  isPlainText = true
  notAlternative = true

[server]
  [[server.headers]]
    for = "/menu-search.json"

    [server.headers.values]
      Access-Control-Allow-Origin = "*"
      Cache-Control = "no-store"

[build]
  writeStats = true

[pagination]
  pagerSize = 6

[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

[params]
  author = "MonkeyTactics"
  description = "Practical guides, privacy-first web tools, and technology insights from MonkeyTactics."
  logo = "images/monkeytactics-logo-transparent.png"
  tagline = "Practical guides for smarter online tools"
  mainSections = ["posts"]

  [params.ui]
    stickyHeader = true
    showSearch = true
    searchEngine = "fuse"

  [params.style]
    fontPreset = "inter"
    palette = "default"
    primary = "#15803d"
    accent = "#16a34a"
    containerMaxWidth = "1280px"
    maxWidthCh = 75

  [params.sidebar]
    globalPosition = "right"
    widgets = ["recent", "tags"]
    recentCount = 5

  [params.list]
    listView = "default"
    showExcerpt = true
    showSectionBadge = false
    groupBy = "none"

  [params.single]
    showPrevNext = true
    showRelated = true
    relatedCount = 4

    [params.single.toc]
      enable = true
      position = "inline"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tools"
    name = "All Tools"
    url = "https://monkeytactics.com/tools/"
    weight = 20
